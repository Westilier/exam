name: CI/CD Web App Deployment

on:
  push:
    branches:
      - main

env:
  REGISTRY_ID: 'crptunc0rd96mk0gib4v'
  CLUSTER_ID: 'catmmdv383rt03oi57ar'
  IMAGE_NAME: 'web-app'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}

      - name: Build and Push Docker Image
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${TAG} .
          docker push cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${TAG}

      - name: Setup Yandex Cloud CLI
        uses: yandex-cloud/yc-actions-setup@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}


      - name: Configure Kubectl and Deploy
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"

          echo '${{ secrets.YC_SA_KEY }}' > sa_key.json
          ./yc config profile create sa-profile || true
          ./yc config set service-account-key sa_key.json
          
          ./yc managed-kubernetes cluster get-credentials ${{ env.CLUSTER_ID }} --external
          
          TAG=${GITHUB_SHA::7}
          kubectl set image deployment/web-app web-app=cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${TAG}
          
          kubectl rollout status deployment/web-app